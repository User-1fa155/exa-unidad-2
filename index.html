        const qData = quizData[currentQuestion];
        progressEl.textContent = `Pregunta ${currentQuestion + 1} de ${quizData.length}`;
        questionEl.textContent = qData.q;
        
        optionsEl.innerHTML = "";
        
        qData.options.forEach((opt, index) => {
            const li = document.createElement("li");
            const label = document.createElement("label");
            const input = document.createElement("input");
            input.type = "radio";
            input.name = "option";
            input.value = index;
            
            input.addEventListener("change", () => {
                if(!answered) btnNext.disabled = false;
            });
            
            label.appendChild(input);
            label.appendChild(document.createTextNode(opt));
            li.appendChild(label);
            optionsEl.appendChild(li);
        });
    }

    btnNext.addEventListener("click", () => {
        if (!answered) {
            // Check Answer Phase
            const selected = document.querySelector('input[name="option"]:checked');
            if (selected) {
                answered = true;
                const answerValue = parseInt(selected.value);
                const correctValue = quizData[currentQuestion].answer;
                
                // Disable all radios
                const radios = document.querySelectorAll('input[name="option"]');
                radios.forEach(r => r.disabled = true);
                
                if (answerValue === correctValue) {
                    score++;
                    feedbackEl.textContent = "¡Correcto!";
                    feedbackEl.classList.add("correct");
                } else {
                    feedbackEl.innerHTML = `Incorrecto. La respuesta correcta era:<br><strong>${quizData[currentQuestion].options[correctValue]}</strong>`;
                    feedbackEl.classList.add("incorrect");
                }
                
                feedbackEl.style.display = "block";
                
                if (currentQuestion < quizData.length - 1) {
                    btnNext.textContent = "Siguiente Pregunta";
                } else {
                    btnNext.textContent = "Ver Resultados Finales";
                }
            }
        } else {
            // Next Question Phase
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }
    });

    function showResults() {
        quizScreen.style.display = "none";
        resultScreen.style.display = "block";
        scoreDisplay.textContent = `${score} / ${quizData.length}`;
        
        const percentage = (score / quizData.length) * 100;
        let message = "";
        
        if (percentage >= 90) {
            message = "¡Excelente trabajo! Tienes un dominio total de la unidad. El 100 está asegurado.";
        } else if (percentage >= 70) {
            message = "¡Muy bien! Estás preparado/a para alcanzar ese 70 o más en tu examen. Repasa un poco los errores y estarás perfecto/a.";
        } else {
            message = "Aún hay áreas de oportunidad. Te recomiendo volver a leer el documento y realizar el examen nuevamente para mejorar tu calificación.";
        }
        
        scoreMessage.textContent = message;
    }

    // Inicializar el quiz
    loadQuestion();
</script>

</html>
